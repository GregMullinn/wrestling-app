<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0c0a0d">
<title>RINGSIDE</title>
<style>
/* ============================================================
   RINGSIDE — a career-progression card game
   Phase 2: stats, endings, act gating, flags and story chains.
   All art is CSS + emoji. No build step, no external assets.
   ============================================================ */

:root{
  --bg:#0c0a0d;
  --bg2:#15111a;
  --canvas:#2a2430;
  --ink:#f4efe6;
  --dim:#9a8f9e;
  --blood:#c9202f;
  --blood2:#8c1420;
  --gold:#f0c24a;
  --rope:#d8d2c4;
  --good:#3ddc84;
  --bad:#ff4d5e;
  --health:#ff5b6e;
  --fame:#f0c24a;
  --money:#4ade80;
  --skill:#5aa9ff;
  --card-w:min(88vw, 360px);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

html,body{height:100%;margin:0;}

body{
  background:
    radial-gradient(120% 80% at 50% -10%, #241b2b 0%, transparent 60%),
    radial-gradient(90% 60% at 50% 110%, #1b1220 0%, transparent 60%),
    var(--bg);
  color:var(--ink);
  font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;
  display:flex;
  flex-direction:column;
  align-items:center;
  overflow:hidden;
  user-select:none;
  -webkit-user-select:none;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}

/* faint spotlight haze over the ring */
body::after{
  content:"";
  position:fixed;inset:0;
  background:radial-gradient(60% 45% at 50% 38%, rgba(255,240,200,.07), transparent 70%);
  pointer-events:none;
}

#app{
  width:100%;
  max-width:460px;
  height:100%;
  display:flex;
  flex-direction:column;
  padding:10px 14px 14px;
  position:relative;
  z-index:2;
}

/* ---------- header ---------- */
header{
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  gap:8px;
  flex:0 0 auto;
}
.logo{
  font-weight:900;
  font-size:22px;
  letter-spacing:.22em;
  color:var(--ink);
  text-shadow:0 0 12px rgba(201,32,47,.7), 2px 2px 0 var(--blood2);
}
.logo span{color:var(--blood);}
.meta{
  text-align:right;
  line-height:1.15;
}
.round-no{
  font-weight:800;
  font-size:13px;
  letter-spacing:.08em;
  color:var(--ink);
}
.act-label{
  font-size:10px;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--dim);
}

/* ---------- stats ---------- */
.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin:12px 0 6px;
  flex:0 0 auto;
}
.stat{
  position:relative;
  text-align:center;
  padding:6px 2px 5px;
  border-radius:9px;
  background:rgba(255,255,255,.035);
  border:1px solid rgba(255,255,255,.06);
  transition:transform .18s ease, box-shadow .18s ease, background .18s ease;
}
.stat .ico{font-size:17px;line-height:1;display:block;filter:grayscale(.35) brightness(.85);transition:filter .15s, transform .15s;}
.stat.armed .ico{filter:none;transform:scale(1.22);}
.stat.armed{background:rgba(255,255,255,.09);box-shadow:0 0 0 1px rgba(240,194,74,.45), 0 0 14px rgba(240,194,74,.18);}
.stat .track{
  height:5px;
  margin:5px 3px 3px;
  border-radius:99px;
  background:rgba(0,0,0,.45);
  overflow:hidden;
}
.stat .fill{
  height:100%;
  width:50%;
  border-radius:99px;
  transition:width .45s cubic-bezier(.3,1.4,.5,1), background .2s;
}
.stat[data-k="health"] .fill{background:linear-gradient(90deg,#8c1420,var(--health));}
.stat[data-k="fame"]   .fill{background:linear-gradient(90deg,#7a5d10,var(--fame));}
.stat[data-k="money"]  .fill{background:linear-gradient(90deg,#155f34,var(--money));}
.stat[data-k="skill"]  .fill{background:linear-gradient(90deg,#183d6b,var(--skill));}
.stat .num{
  font-size:10px;
  font-weight:800;
  color:var(--dim);
  letter-spacing:.06em;
}
.stat.flash-up{animation:flashUp .5s ease;}
.stat.flash-dn{animation:flashDn .5s ease;}
.stat.big .num{font-size:12px;}
@keyframes flashUp{
  0%{background:rgba(61,220,132,.55);transform:translateY(-3px) scale(1.06);}
  100%{background:rgba(255,255,255,.035);transform:none;}
}
@keyframes flashDn{
  0%{background:rgba(255,77,94,.55);transform:translateY(3px) scale(1.06);}
  100%{background:rgba(255,255,255,.035);transform:none;}
}

/* ---------- deck ---------- */
.deck{
  flex:1 1 auto;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:0;
}

/* ring ropes behind the card */
.ropes{position:absolute;inset:0;pointer-events:none;opacity:.5;}
.ropes i{
  position:absolute;left:-6%;right:-6%;height:3px;
  background:linear-gradient(90deg,transparent,var(--rope),transparent);
  opacity:.16;
}
.ropes i:nth-child(1){top:22%;}
.ropes i:nth-child(2){top:38%;}
.ropes i:nth-child(3){top:54%;}

.card{
  position:absolute;
  width:var(--card-w);
  height:min(58vh, 420px);
  border-radius:18px;
  background:
    linear-gradient(170deg, #3a3140 0%, #241d2b 55%, #1a1420 100%);
  border:1px solid rgba(255,255,255,.1);
  box-shadow:
    0 22px 40px rgba(0,0,0,.6),
    inset 0 1px 0 rgba(255,255,255,.12);
  padding:22px 20px 18px;
  display:flex;
  flex-direction:column;
  align-items:center;
  text-align:center;
  touch-action:none;
  cursor:grab;
  will-change:transform;
  overflow:hidden;
}
.card::before{ /* grimy vignette */
  content:"";position:absolute;inset:0;
  background:radial-gradient(70% 55% at 50% 22%, rgba(255,235,190,.10), transparent 70%);
  pointer-events:none;
}
.card.dragging{cursor:grabbing;transition:none;}
.card.settle{transition:transform .32s cubic-bezier(.2,1.5,.45,1);}
.card.fly{transition:transform .3s ease-in, opacity .3s ease-in;}

/* ghost card peeking underneath */
.card.ghost{
  transform:translateY(14px) scale(.94);
  filter:brightness(.55) saturate(.6);
  pointer-events:none;
  box-shadow:0 14px 26px rgba(0,0,0,.5);
}

.portrait{
  width:96px;height:96px;flex:0 0 auto;
  border-radius:50%;
  display:grid;place-items:center;
  font-size:48px;
  background:radial-gradient(circle at 35% 30%, #4b4055, #201926 70%);
  border:2px solid rgba(240,194,74,.35);
  box-shadow:0 0 0 6px rgba(0,0,0,.25), 0 8px 18px rgba(0,0,0,.45);
  margin-bottom:12px;
}
.char{
  font-size:11px;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--gold);
  font-weight:800;
  margin-bottom:12px;
}
.dialogue{
  font-size:17px;
  line-height:1.42;
  font-weight:600;
  color:var(--ink);
  flex:1 1 auto;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0 2px;
}
.hint{
  font-size:10px;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:rgba(255,255,255,.22);
  flex:0 0 auto;
}

/* Response text. Lives in the deck, not on the card, so it never rides
   off-screen when the card travels. One side fades in as you tilt. */
.resp{
  position:absolute;
  top:2px;
  max-width:70%;
  font-size:13.5px;
  font-weight:800;
  line-height:1.32;
  opacity:0;
  pointer-events:none;
  transition:opacity .08s linear;
  padding:8px 11px;
  border-radius:10px;
  background:rgba(10,7,12,.82);
  box-shadow:0 6px 16px rgba(0,0,0,.5);
  z-index:5;
}
.resp.l{left:2px;text-align:left;color:#ff9aa4;border-left:3px solid var(--blood);}
.resp.r{right:2px;text-align:right;color:#9fd2ff;border-right:3px solid var(--skill);}
.resp .arrow{display:block;font-size:10px;letter-spacing:.14em;opacity:.55;color:var(--ink);}

/* ---------- footer ---------- */
footer{
  flex:0 0 auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding-top:10px;
  font-size:10px;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--dim);
}
.swipe-key{opacity:.6;}

/* ---------- shake ---------- */
.shake{animation:shake .38s cubic-bezier(.36,.07,.19,.97);}
.shake-hard{animation:shake .5s cubic-bezier(.36,.07,.19,.97);}
@keyframes shake{
  10%,90%{transform:translateX(-2px);}
  20%,80%{transform:translateX(4px);}
  30%,50%,70%{transform:translateX(-7px);}
  40%,60%{transform:translateX(7px);}
}

/* ---------- act change banner ---------- */
.act-label.bump{animation:bump .9s ease;}
@keyframes bump{
  0%{color:var(--gold);transform:scale(1.35);letter-spacing:.3em;}
  100%{color:var(--dim);transform:none;letter-spacing:.16em;}
}

/* ---------- end screen ---------- */
.endscreen{
  position:absolute;
  inset:0;
  z-index:20;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:16px 14px;
  border-radius:18px;
  background:
    radial-gradient(90% 60% at 50% 18%, rgba(201,32,47,.16), transparent 65%),
    linear-gradient(175deg, #241d2b 0%, #14101a 70%);
  border:1px solid rgba(255,255,255,.1);
  box-shadow:0 22px 44px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,255,255,.1);
  animation:endIn .45s cubic-bezier(.2,1.2,.4,1) both;
  overflow-y:auto;
}
@keyframes endIn{
  from{opacity:0;transform:translateY(22px) scale(.95);}
  to{opacity:1;transform:none;}
}
.endscreen.win{
  background:
    radial-gradient(90% 60% at 50% 18%, rgba(240,194,74,.22), transparent 65%),
    linear-gradient(175deg, #2c2618 0%, #14101a 70%);
}
.end-ico{font-size:52px;line-height:1;margin-bottom:6px;}
.end-kicker{
  font-size:10px;letter-spacing:.24em;text-transform:uppercase;
  color:var(--dim);margin-bottom:4px;
}
.end-title{
  font-size:25px;font-weight:900;letter-spacing:.04em;line-height:1.1;
  color:var(--blood);text-shadow:0 2px 12px rgba(201,32,47,.45);
  margin-bottom:10px;text-transform:uppercase;
}
.endscreen.win .end-title{color:var(--gold);text-shadow:0 2px 14px rgba(240,194,74,.45);}
.end-text{
  font-size:14.5px;line-height:1.5;font-weight:600;color:var(--ink);
  max-width:300px;margin-bottom:14px;
}
.end-round{
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--dim);margin-bottom:12px;
}
.end-round b{color:var(--ink);font-size:13px;}
.end-stats{
  width:100%;max-width:290px;display:flex;flex-direction:column;gap:5px;
  margin-bottom:14px;
}
.end-row{display:flex;align-items:center;gap:8px;font-size:11px;}
.end-row .en{width:16px;text-align:center;font-size:13px;}
.end-row .et{
  display:block;flex:1;height:6px;border-radius:99px;
  background:rgba(0,0,0,.5);overflow:hidden;
}
.end-row .ef{display:block;height:100%;border-radius:99px;}
.end-row .ev{width:26px;text-align:right;font-weight:800;color:var(--ink);}
.end-row.fail .ev{color:var(--bad);}
.end-best{
  font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--dim);margin-bottom:14px;
}
.end-best b{color:var(--gold);}
.btn{
  appearance:none;border:0;cursor:pointer;
  font-family:inherit;font-weight:900;font-size:13px;
  letter-spacing:.18em;text-transform:uppercase;
  color:#fff;padding:13px 30px;border-radius:11px;
  background:linear-gradient(180deg,var(--blood),var(--blood2));
  box-shadow:0 6px 0 #5c0d15, 0 12px 22px rgba(0,0,0,.45);
  transition:transform .1s ease, box-shadow .1s ease;
}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #5c0d15, 0 6px 12px rgba(0,0,0,.45);}

/* ---------- debug ---------- */
#debugbar{
  display:none;
  gap:6px;
  align-items:center;
  font-size:10px;
  color:#8be9fd;
  padding:6px 0 0;
}
#debugbar.on{display:flex;flex-wrap:wrap;}
#debugbar button{
  background:#1d2733;color:#8be9fd;border:1px solid #31465c;
  border-radius:6px;font-size:10px;padding:3px 7px;cursor:pointer;
}
.debug-deltas{
  position:absolute;bottom:8px;left:0;right:0;
  font-size:10px;color:#8be9fd;letter-spacing:.04em;
  display:flex;justify-content:space-between;padding:0 12px;
}
</style>
</head>
<body>
<div id="app">

  <header>
    <div class="logo">RING<span>SIDE</span></div>
    <div class="meta">
      <div class="round-no">ROUND <span id="roundNo">1</span>/25</div>
      <div class="act-label" id="actLabel">Act I — The Indies</div>
    </div>
  </header>

  <div class="stats" id="stats"></div>
  <div id="debugbar"></div>

  <div class="deck" id="deck">
    <div class="ropes"><i></i><i></i><i></i></div>
    <div class="resp l" id="respL"></div>
    <div class="resp r" id="respR"></div>
  </div>

  <footer>
    <div class="swipe-key">&#8592; drag / swipe &#8594;</div>
    <div class="swipe-key" id="bestLine"></div>
  </footer>

</div>

<script>
"use strict";

/* ============================================================
   CONSTANTS
   ============================================================ */
const DEBUG         = false;   // true: show numeric deltas + round jumping
const LOSE_AT_MAX   = true;    // true: hitting 100 on a stat also ends the run
const TOTAL_ROUNDS  = 25;
const WIN_THRESHOLD = 40;      // all four stats must clear this at round 25
const START_VALUE   = 50;

const ACTS = [
  { act:1, from:1,  to:8,  label:"Act I — The Indies" },
  { act:2, from:9,  to:17, label:"Act II — Regionals" },
  { act:3, from:18, to:25, label:"Act III — The Call-Up" }
];

const STAT_DEFS = [
  { key:"health", icon:"❤️", name:"Health" },
  { key:"fame",   icon:"📣", name:"Fame"   },
  { key:"money",  icon:"💰", name:"Money"  },
  { key:"skill",  icon:"🤼", name:"Skill"  }
];


/* ============================================================
   ENDINGS
   Keys are "<stat>_min" / "<stat>_max", plus the two round-25 outcomes.
   ============================================================ */
const ENDINGS = {
  health_min: {
    icon:"🦴", kicker:"Your body gave out", title:"Broken Body",
    text:"Your hip goes in a bingo hall in Rotherham and it does not come back. The boys carry you to the car. Someone posts the clip. You watch it more times than you would like to admit."
  },
  fame_min: {
    icon:"🕳️", kicker:"Nobody called back", title:"Nobody Knows You",
    text:"You are the guy who wrestled for a bit. You are in the background of other people's photos. The promoter spells your name wrong on the poster and nobody writes in to correct it."
  },
  money_min: {
    icon:"📦", kicker:"The money ran out", title:"Evicted And Broke",
    text:"Your gear is in a bin bag in your mate's spare room. You did the maths on petrol to a show in Crewe and the maths said no. That was the last one, you just did not know it at the time."
  },
  skill_min: {
    icon:"🤡", kicker:"They saw through you", title:"Exposed In The Ring",
    text:"Twelve hundred people watch you blow a simple spot and the whole building goes quiet in a way that never fully leaves you. The clip does numbers. You do not."
  },

  health_max: {
    icon:"💊", kicker:"You felt no pain at all", title:"Burned Out",
    text:"You have never felt better and that is the problem. Little blue ones before the match, little white ones after, and a doctor who signs whatever you slide across the desk. You are in perfect condition right up until you are not."
  },
  fame_max: {
    icon:"👹", kicker:"Too big for the room", title:"Fame Monster",
    text:"Everybody knows your name and not one of them wants you in their locker room. You no-show a spot date because the venue was beneath you. The bookings dry up in a week. The fans take longer."
  },
  money_max: {
    icon:"🛋️", kicker:"You got comfortable", title:"Soft And Complacent",
    text:"The merch money is very good. Good enough that you stopped taking the bumps that made it. You open a gym. You tell the lads you could still go if you wanted. Everyone nods."
  },
  skill_max: {
    icon:"📐", kicker:"Nobody could follow you", title:"Too Good To Book",
    text:"Your matches are flawless and nobody can work with you. You correct a veteran in front of the boys. You take the finish apart in the dressing room. They stop asking. Perfect is a lonely gimmick."
  },

  win: {
    icon:"🏆", kicker:"Round 25 — you made it", title:"The Big Leagues",
    text:"Marcy slides the contract across a table in a hotel you could not have afforded last year. Your knee hurts, your phone will not stop, and somewhere a kid is watching your match in a church hall thinking that could be me. You sign it."
  },
  tryout_fail: {
    icon:"🚪", kicker:"Round 25 — the tryout", title:"You Got The Look Around",
    text:"You get the tryout. You get the tour of the building, the handshake, the photo. Then you get the drive home, and the call that does not come, and a very long time to work out which bit of it you got wrong."
  }
};

/* which stat let you down at the tryout, for a sharper closing line */

  health:"The medical was the bit that did you in.",
  fame:"Nobody in the room knew who you were.",
  money:"You turned up looking like you needed it too badly.",

const game = {
  round:1,
  stats:{},
  flags:new Set(),
  used:new Set(),      // ids of `once` cards already played
  recent:[],           // recently drawn ids, to avoid repeats
  forcedNext:null,     // card id forced by a choice's `next`
  card:null,
  over:false,
  busy:false
};

/* ============================================================
   HELPERS
   ============================================================ */
function actForRound(r){
  for(const a of ACTS){ if(r >= a.from && r <= a.to) return a; }
  return ACTS[ACTS.length-1];
}
function clamp(n,lo,hi){ return Math.max(lo, Math.min(hi, n)); }

/* ============================================================
   STATS UI
   ============================================================ */
function buildStats(){
  el.stats.innerHTML = "";
  STAT_DEFS.forEach(function(s){
    const d = document.createElement("div");
    d.className = "stat";
    d.dataset.k = s.key;
    d.innerHTML =
      '<span class="ico">'+s.icon+'</span>'+
      '<div class="track"><div class="fill"></div></div>'+
      '<div class="num">'+START_VALUE+'</div>';
    el.stats.appendChild(d);
  });
}
function statEl(key){ return el.stats.querySelector('.stat[data-k="'+key+'"]'); }

function renderStats(){
  STAT_DEFS.forEach(function(s){
    const v = game.stats[s.key];
    const node = statEl(s.key);
    node.querySelector(".fill").style.width = clamp(v,0,100)+"%";
    node.querySelector(".num").textContent = Math.round(v);
  });
}

/* highlight which stats a pending choice will touch (no numbers) */
function armStats(effects){
  STAT_DEFS.forEach(function(s){
    const node = statEl(s.key);
    node.classList.toggle("armed", !!(effects && effects[s.key]));
  });
}
function disarmStats(){
  STAT_DEFS.forEach(function(s){ statEl(s.key).classList.remove("armed"); });
}

function applyEffects(effects){
  let biggest = 0;
  Object.keys(effects || {}).forEach(function(k){
    if(game.stats[k] === undefined) return;
    const delta = effects[k];
    game.stats[k] = clamp(game.stats[k] + delta, 0, 100);
    biggest = Math.max(biggest, Math.abs(delta));
    const node = statEl(k);
    node.classList.remove("flash-up","flash-dn");
    void node.offsetWidth;                       // restart the animation
    node.classList.add(delta >= 0 ? "flash-up" : "flash-dn");
  });
  renderStats();
  if(biggest >= 15) shake(true);
  else if(biggest >= 8) shake(false);
}

function shake(hard){
  el.app.classList.remove("shake","shake-hard");
  void el.app.offsetWidth;
  el.app.classList.add(hard ? "shake-hard" : "shake");
  setTimeout(function(){ el.app.classList.remove("shake","shake-hard"); }, 520);
}

/* ============================================================
   CARD SELECTION
   ============================================================ */
function meetsRequires(card){
  const r = card.requires;
  if(!r) return true;
  if(r.flags    && !r.flags.every(function(f){ return game.flags.has(f); })) return false;
  if(r.notFlags && r.notFlags.some(function(f){ return game.flags.has(f); })) return false;
  if(r.stats){
    for(const k in r.stats){
      const need = r.stats[k], have = game.stats[k];
      if(need.min !== undefined && have < need.min) return false;
      if(need.max !== undefined && have > need.max) return false;
    }
  }
  return true;
}

function eligible(act, avoidRecent){
  return CARDS.filter(function(c){
    if(c.act !== act) return false;
    if(c.chainOnly) return false;                  // only reachable via `next`
    if(c.once && game.used.has(c.id)) return false;
    if(avoidRecent && game.recent.indexOf(c.id) !== -1) return false;
    return meetsRequires(c);
  });
}

function pickCard(){
  // a choice may force the next card
  if(game.forcedNext){
    const forced = CARDS.find(function(c){ return c.id === game.forcedNext; });
    game.forcedNext = null;
    if(forced) return forced;
  }
  const act = actForRound(game.round).act;
  let pool = eligible(act, true);
  if(!pool.length) pool = eligible(act, false);          // recent filter too tight
  if(!pool.length){                                      // act exhausted: widen out
    pool = CARDS.filter(function(c){
      return !c.chainOnly && !(c.once && game.used.has(c.id)) && meetsRequires(c);
    });
  }
  if(!pool.length) pool = CARDS.filter(function(c){ return !c.chainOnly; });

  const total = pool.reduce(function(s,c){ return s + (c.weight || 1); }, 0);
  let roll = Math.random() * total;
  for(const c of pool){
    roll -= (c.weight || 1);
    if(roll <= 0) return c;
  }
  return pool[pool.length-1];
}

/* ============================================================
   CARD RENDERING + SWIPE
   ============================================================ */
let cardEl = null, ghostEl = null;

function buildCardNode(card, isGhost){
  const n = document.createElement("div");
  n.className = "card" + (isGhost ? " ghost" : "");
  n.innerHTML =
    '<div class="portrait">'+card.portrait+'</div>'+
    '<div class="char">'+card.character+'</div>'+
    '<div class="dialogue">'+card.text+'</div>'+
    '<div class="hint">swipe to answer</div>';
  if(!isGhost){
    if(DEBUG){
      const dd = document.createElement("div");
      dd.className = "debug-deltas";
      dd.innerHTML = '<span>'+fmtEffects(card.left.effects)+'</span><span>'+fmtEffects(card.right.effects)+'</span>';
      n.appendChild(dd);
    }
  }
  return n;
}
function fmtEffects(e){
  return Object.keys(e || {}).map(function(k){
    return k.slice(0,2).toUpperCase() + (e[k] >= 0 ? "+" : "") + e[k];
  }).join(" ") || "—";
}

function hideResponses(){
  el.respL.style.opacity = 0;
  el.respR.style.opacity = 0;
}

function nextRound(){
  game.card = pickCard();
  if(game.card.once) game.used.add(game.card.id);
  game.recent.push(game.card.id);
  if(game.recent.length > 8) game.recent.shift();

  el.respL.innerHTML = '<span class="arrow">\u2190 LEFT</span>';
  el.respR.innerHTML = '<span class="arrow">RIGHT \u2192</span>';
  el.respL.append(game.card.left.text);
  el.respR.append(game.card.right.text);
  hideResponses();

  const a = actForRound(game.round);
  el.roundNo.textContent = game.round;
  if(el.actLabel.textContent !== a.label){
    el.actLabel.textContent = a.label;
    el.actLabel.classList.remove("bump");
    void el.actLabel.offsetWidth;
    el.actLabel.classList.add("bump");
  }

  if(ghostEl) ghostEl.remove();
  ghostEl = buildCardNode(game.card, true);
  el.deck.appendChild(ghostEl);

  cardEl = buildCardNode(game.card, false);
  el.deck.appendChild(cardEl);
  attachDrag(cardEl);

  // deal-in flourish
  cardEl.style.transform = "translateY(26px) scale(.93)";
  cardEl.style.opacity = "0";
  requestAnimationFrame(function(){
    cardEl.classList.add("settle");
    cardEl.style.transition = "transform .3s cubic-bezier(.2,1.3,.4,1), opacity .25s ease";
    cardEl.style.transform = "translate(0,0) rotate(0deg)";
    cardEl.style.opacity = "1";
    setTimeout(function(){
      if(cardEl){ cardEl.style.transition = ""; cardEl.classList.remove("settle"); }
      game.busy = false;
    }, 300);
  });
}

const THRESHOLD = 78;   // px of horizontal travel needed to commit

function attachDrag(node){
  let dragging = false, decided = false, startX = 0, startY = 0, dx = 0, pid = null;

  function setTilt(x){
    const rot = clamp(x * 0.055, -16, 16);
    node.style.transform = "translateX("+x+"px) rotate("+rot+"deg)";
    const t = clamp(Math.abs(x) / THRESHOLD, 0, 1);
    const leftSide = x < 0;
    el.respL.style.opacity = leftSide ? t : 0;
    el.respR.style.opacity = leftSide ? 0 : t;
    if(Math.abs(x) > 14) armStats(game.card[leftSide ? "left" : "right"].effects);
    else disarmStats();
  }
  function reset(){
    node.classList.add("settle");
    node.style.transform = "translateX(0) rotate(0deg)";
    hideResponses();
    disarmStats();
    setTimeout(function(){ if(node) node.classList.remove("settle"); }, 320);
  }

  node.addEventListener("pointerdown", function(e){
    if(game.busy || game.over) return;
    dragging = true; decided = false;
    startX = e.clientX; startY = e.clientY; dx = 0; pid = e.pointerId;
    node.setPointerCapture(pid);
    node.classList.add("dragging");
  });

  node.addEventListener("pointermove", function(e){
    if(!dragging) return;
    const mx = e.clientX - startX, my = e.clientY - startY;
    if(!decided){
      if(Math.abs(mx) < 6 && Math.abs(my) < 6) return;
      decided = true;
    }
    dx = mx;
    setTilt(dx);
  });

  function end(){
    if(!dragging) return;
    dragging = false;
    node.classList.remove("dragging");
    if(Math.abs(dx) >= THRESHOLD) commit(dx < 0 ? "left" : "right");
    else reset();
  }
  node.addEventListener("pointerup", end);
  node.addEventListener("pointercancel", end);
  node.addEventListener("lostpointercapture", end);

  node._flick = function(dir){
    setTilt(dir === "left" ? -THRESHOLD : THRESHOLD);
    setTimeout(function(){ commit(dir); }, 130);
  };
}

function commit(side){
  if(game.busy || game.over) return;
  game.busy = true;

  const choice = game.card[side];
  const node = cardEl;
  const off = side === "left" ? -window.innerWidth : window.innerWidth;

  node.classList.add("fly");
  node.style.transform = "translateX("+off+"px) rotate("+(side==="left"?-28:28)+"deg)";
  node.style.opacity = "0";

  hideResponses();
  disarmStats();
  applyEffects(choice.effects);
  if(choice.flags) choice.flags.forEach(function(f){ game.flags.add(f); });
  if(choice.next) game.forcedNext = choice.next;

  const roundReached = game.round;
  const blowout = checkEndings();

  setTimeout(function(){
    node.remove();
    cardEl = null;

    if(blowout){                                  // a stat hit 0 or 100
      finish(blowout, roundReached, false);
      return;
    }

    game.round++;
    if(game.round > TOTAL_ROUNDS){                // survived the full career
      const short = shortfalls();
      if(short.length) finish(ENDINGS.tryout_fail, TOTAL_ROUNDS, false, short);
      else             finish(ENDINGS.win, TOTAL_ROUNDS, true);
      return;
    }
    nextRound();
  }, 320);
}

/* ============================================================
   ENDING CHECKS
   ============================================================ */
function checkEndings(){
  for(const s of STAT_DEFS){
    const v = game.stats[s.key];
    if(v <= 0) return ENDINGS[s.key + "_min"];
    if(LOSE_AT_MAX && v >= 100) return ENDINGS[s.key + "_max"];
  }
  return null;
}

/* stats that failed to clear the round-25 threshold */
function shortfalls(){
  return STAT_DEFS.filter(function(s){ return game.stats[s.key] < WIN_THRESHOLD; })
                  .map(function(s){ return s.key; });
}

/* ============================================================
   BEST RUN (localStorage)
   Wrapped: storage throws in private mode and can come back empty.
   ============================================================ */
const BEST_KEY = "ringside.best.v1";

function loadBest(){
  try{
    const raw = localStorage.getItem(BEST_KEY);
    if(!raw) return { round:0, wins:0, runs:0 };
    const b = JSON.parse(raw);
    return {
      round: Number(b.round) || 0,
      wins:  Number(b.wins)  || 0,
      runs:  Number(b.runs)  || 0
    };
  }catch(e){
    return { round:0, wins:0, runs:0 };
  }
}
function saveBest(b){
  try{ localStorage.setItem(BEST_KEY, JSON.stringify(b)); }catch(e){}
}

/* ============================================================
   END SCREEN
   ============================================================ */
function finish(ending, roundReached, won, short){
  game.over = true;
  game.busy = true;

  const best = loadBest();
  best.runs += 1;
  best.round = Math.max(best.round, roundReached);
  if(won) best.wins += 1;
  saveBest(best);

  let body = ending.text;
  if(short && short.length){
    body += " " + SHORTFALL_LINE[short[0]];
  }

  const screen = document.createElement("div");
  screen.className = "endscreen" + (won ? " win" : "");

  let rows = "";
  STAT_DEFS.forEach(function(s){
    const v = Math.round(game.stats[s.key]);
    const failed = v < WIN_THRESHOLD;
    rows +=
      '<div class="end-row'+(failed ? " fail" : "")+'">'+
        '<span class="en">'+s.icon+'</span>'+
        '<span class="et"><span class="ef" style="width:'+clamp(v,0,100)+'%;'+
          'background:var(--'+s.key+')"></span></span>'+
        '<span class="ev">'+v+'</span>'+
      '</div>';
  });

  screen.innerHTML =
    '<div class="end-ico">'+ending.icon+'</div>'+
    '<div class="end-kicker">'+ending.kicker+'</div>'+
    '<div class="end-title">'+ending.title+'</div>'+
    '<div class="end-text">'+body+'</div>'+
    '<div class="end-round">Reached round <b>'+roundReached+'</b> of '+TOTAL_ROUNDS+'</div>'+
    '<div class="end-stats">'+rows+'</div>'+
    '<div class="end-best">Best run <b>R'+best.round+'</b> &nbsp;·&nbsp; '+
      best.wins+' signed &nbsp;·&nbsp; '+best.runs+
      (best.runs === 1 ? ' career' : ' careers')+'</div>'+
    '<button class="btn" id="again">Run again</button>';

  el.deck.appendChild(screen);
  screen.querySelector("#again").addEventListener("click", start);
  renderBestFooter();
}

/* keyboard */
window.addEventListener("keydown", function(e){
  if(game.busy || game.over || !cardEl) return;
  if(e.key === "ArrowLeft"){  e.preventDefault(); cardEl._flick("left");  }
  if(e.key === "ArrowRight"){ e.preventDefault(); cardEl._flick("right"); }
});

/* ============================================================
   DEBUG BAR
   ============================================================ */
function buildDebug(){
  if(!DEBUG) return;
  el.debugbar.classList.add("on");
  el.debugbar.innerHTML = '<span>DEBUG</span>';
  [1,5,9,14,18,22,25].forEach(function(r){
    const b = document.createElement("button");
    b.textContent = "R"+r;
    b.onclick = function(){
      game.round = r;
      if(cardEl){ cardEl.remove(); cardEl = null; }
      game.busy = false;
      nextRound();
    };
    el.debugbar.appendChild(b);
  });
}

/* ============================================================
   BOOT
   ============================================================ */
function renderBestFooter(){
  const b = loadBest();
  el.bestLine.textContent = b.runs
    ? "best R" + b.round + " \u00b7 " + b.wins + " signed"
    : "arrow keys work too";
}

function start(){
  game.round = 1;
  game.over = false;
  game.busy = false;
  game.flags = new Set();
  game.used = new Set();
  game.recent = [];
  game.forcedNext = null;
  game.card = null;
  STAT_DEFS.forEach(function(s){ game.stats[s.key] = START_VALUE; });

  // wipe the board: end screen, leftover cards, stale ghost
  el.deck.querySelectorAll(".endscreen, .card").forEach(function(n){ n.remove(); });
  cardEl = null;
  ghostEl = null;
  el.actLabel.textContent = "";
  hideResponses();

  buildStats();
  renderStats();
  renderBestFooter();
  buildDebug();
  nextRound();
}
start();
</script>
